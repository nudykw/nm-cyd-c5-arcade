[package]
name = "cyd-c5-wifi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Wi-Fi (2.4 + 5 GHz) для GameLauncher на NM-CYD-C5: esp-radio, DHCP, екран вибору мережі"

[dependencies]
esp-hal.workspace = true
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c5", "wifi", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32c5", "esp-radio", "esp-alloc", "embassy"] }
esp-alloc = { version = "0.11.0", features = ["esp32c5"] }
esp-println.workspace = true
critical-section.workspace = true
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "udp", "tcp", "dns", "medium-ethernet"] }
static_cell = "2.1.1"
embedded-graphics.workspace = true
cyd-c5-common.workspace = true
embedded-tls = { version = "0.19.0", default-features = false, features = ["alloc", "rustpki", "rsa", "p384"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }
rand_core = "0.6.4"
embedded-io-async = "0.7"

